*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,"Noto Sans Hebrew",sans-serif;font-size:1.0625rem;line-height:1.6}button,select{font:inherit}a{color:var(--green);text-underline-offset:.22em}button,.btn{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:.55rem .9rem;color:var(--deep);background:var(--card);font-weight:700;min-height:44px}button:hover,.btn:hover{border-color:var(--green);background:var(--mint)}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ba7427;outline-offset:3px}button.primary{color:white;background:var(--green);border-color:var(--green)}button.primary:hover{background:var(--deep)}button:disabled{cursor:default;opacity:.48}.wrap{max-width:1040px;margin:auto;padding-inline:24px}

eight:8px;display:block;border:0;border-radius:8px;margin:14px 0 20px;accent-color:var(--green);overflow:hidden}.meter::-webkit-progress-bar{background:#e5eadf}.meter::-webkit-progress-value{background:var(--green)}.question{margin:0;font-size:clamp(1.38rem,4vw,1.94rem);line-height:1.5}.answers{display:grid;gap:9px;margin-top:16px}.option{text-align:right;display:flex;gap:.7rem;align-items:center;font-weight:400}.letter-sm{min-width:27px;height:27px;border-radius:7px;display:grid;place-items:center;font-size:.93rem;background:var(--mint);font-weight:700}.option.chosen{background:#e1eee4;border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.option.right{background:#e7f1e5;border-color:#578365}.option.wrong{background:#fbeae4;border-color:#b97762}.option:disabled{opacity:1}.feedback{border-inline-start:4px solid var(--green);border-radius:9px;margin:16px 0;padding:12px 15px;background:var(--mint)}.feedback p{margin:.25rem 0 .55rem}.feedback.correction{border-color:#b97762;background:#fcf1e9}.quiz-bottom{margin-top:18px}.review{border-top:1px solid var(--line);padding-block:12px}.review summary{cursor:pointer}.review p{margin:.5rem 0}.score{font-size:2.55rem;font-weight:700;color:var(--green);line-height:1.1;margin:.35rem 0}.note{font-size:.91rem}.status{min-height:1.4em;margin:9px 0 0;color:var(--quiet);font-size:.9rem}.status:not(:empty){position:fixed;z-index:5;bottom:16px;inset-inline:14px;max-width:560px;margin-inline:auto;background:var(--deep);color:white;border-radius:12px;padding:10px 15px;box-shadow:0 3px 15px #163e3655}.return-bar{position:sticky;z-index:2;top:8px;display:flex;justify-content:flex-end;margin:0 0 12px;pointer-events:none}.return-bar button{pointer-events:auto;box-shadow:0 3px 10px #163e3630}footer{padding-block:7px 27px;font-size:.9rem;color:var(--quiet)}[hidden]{display:none!important}

<section class="hero" id="hero"><div><p class="eyebrow">פְּרָקִים א׳–ג׳</p><h1>מַסָּע בִּשְׁמוּאֵל א׳</h1><p>קוֹרְאִים, מַקְשִׁיבִים וּמִתְכּוֹנְנִים לַמִּבְחָן.</p></div><div class="art" aria-hidden="true"><div class="flame"></div><div class="lamp"></div></div></section>

<script>
const verses = [[["א", "וַיְהִי אִישׁ אֶחָד מִן-הָרָמָתַיִם, צוֹפִים--מֵהַר אֶפְרָיִם; וּשְׁמוֹ אֶלְקָנָה בֶּן-יְרֹחָם בֶּן-אֱלִיהוּא, בֶּן-תֹּחוּ בֶן-צוּף--אֶפְרָתִי."], ["ב", "וְלוֹ, שְׁתֵּי נָשִׁים--שֵׁם אַחַת חַנָּה, וְשֵׁם הַשֵּׁנִית פְּנִנָּה; וַיְהִי לִפְנִנָּה יְלָדִים, וּלְחַנָּה אֵין יְלָדִים."], ["ג", "וְעָלָה הָאִישׁ הַהוּא מֵעִירוֹ מִיָּמִים יָמִימָה, לְהִשְׁתַּחֲוֺת וְלִזְבֹּחַ לַיהוָה צְבָאוֹת בְּשִׁלֹה; וְשָׁם שְׁנֵי בְנֵי-עֵלִי, חָפְנִי וּפִנְחָס, כֹּהֲנִים, לַיהוָה."], ["ד", "וַיְהִי הַיּוֹם, וַיִּזְבַּח אֶלְקָנָה; וְנָתַן לִפְנִנָּה אִשְׁתּוֹ, וּלְכָל-בָּנֶיהָ וּבְנוֹתֶיהָ--מָנוֹת."], ["ה", "וּלְחַנָּה, יִתֵּן מָנָה אַחַת אַפָּיִם: כִּי אֶת-חַנָּה אָהֵב, וַיהוָה סָגַר רַחְמָהּ."], ["ו", "וְכִעֲסַתָּה צָרָתָהּ גַּם-כַּעַס, בַּעֲבוּר הַרְּעִמָהּ: כִּי-סָגַר יְהוָה, בְּעַד רַחְמָהּ."], ["ז", "וְכֵן יַעֲשֶׂה שָׁנָה בְשָׁנָה, מִדֵּי עֲלֹתָהּ בְּבֵית יְהוָה--כֵּן, תַּכְעִסֶנָּה; וַתִּבְכֶּה, וְלֹא תֹאכַל."], ["ח", "וַיֹּאמֶר לָהּ אֶלְקָנָה אִישָׁהּ, חַנָּה לָמֶה תִבְכִּי וְלָמֶה לֹא תֹאכְלִי, וְלָמֶה, יֵרַע לְבָבֵךְ: הֲלוֹא אָנֹכִי טוֹב לָךְ, מֵעֲשָׂרָה בָּנִים."], ["ט", "וַתָּקָם חַנָּה, אַחֲרֵי אָכְלָה בְשִׁלֹה וְאַחֲרֵי שָׁתֹה; וְעֵלִי הַכֹּהֵן, יֹשֵׁב עַל-הַכִּסֵּא, עַל-מְזוּזַת, הֵיכַל יְהוָה."], ["י", "וְהִיא, מָרַת נָפֶשׁ; וַתִּתְפַּלֵּל עַל-יְהוָה, וּבָכֹה תִבְכֶּה."], ["יא", "וַתִּדֹּר נֶדֶר וַתֹּאמַר, יְהוָה צְבָאוֹת אִם-רָאֹה תִרְאֶה בָּעֳנִי אֲמָתֶךָ וּזְכַרְתַּנִי וְלֹא-תִשְׁכַּח אֶת-אֲמָתֶךָ, וְנָתַתָּה לַאֲמָתְךָ, זֶרַע אֲנָשִׁים--וּנְתַתִּיו לַיהוָה כָּל-יְמֵי חַיָּיו, וּמוֹרָה לֹא-יַעֲלֶה עַל-רֹאשׁוֹ."], ["יב", "וְהָיָה כִּי הִרְבְּתָה, לְהִתְפַּלֵּל לִפְנֵי יְהוָה; וְעֵלִי, שֹׁמֵר אֶת-פִּיהָ."], ["יג", "וְחַנָּה, הִיא מְדַבֶּרֶת עַל-לִבָּהּ--רַק שְׂפָתֶיהָ נָּעוֹת, וְקוֹלָהּ לֹא יִשָּׁמֵעַ; וַיַּחְשְׁבֶהָ עֵלִי, לְשִׁכֹּרָה."], ["יד", "וַיֹּאמֶר אֵלֶיהָ עֵלִי, עַד-מָתַי תִּשְׁתַּכָּרִין; הָסִירִי אֶת-יֵינֵךְ, מֵעָלָיִךְ."], ["טו", "וַתַּעַן חַנָּה וַתֹּאמֶר, לֹא אֲדֹנִי, אִשָּׁה קְשַׁת-רוּחַ אָנֹכִי, וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי; וָאֶשְׁפֹּךְ אֶת-נַפְשִׁי, לִפְנֵי יְהוָה."], ["טז", "אַל-תִּתֵּן, אֶת-אֲמָתְךָ, לִפְנֵי, בַּת-בְּלִיָּעַל: כִּי-מֵרֹב שִׂיחִי וְכַעְסִי, דִּבַּרְתִּי עַד-הֵנָּה."], ["יז", "וַיַּעַן עֵלִי וַיֹּאמֶר, לְכִי לְשָׁלוֹם; וֵאלֹהֵי יִשְׂרָאֵל, יִתֵּן אֶת-שֵׁלָתֵךְ, אֲשֶׁר שָׁאַלְתְּ, מֵעִמּוֹ."], ["יח", "וַתֹּאמֶר, תִּמְצָא שִׁפְחָתְךָ חֵן בְּעֵינֶיךָ; וַתֵּלֶךְ הָאִשָּׁה לְדַרְכָּהּ וַתֹּאכַל, וּפָנֶיהָ לֹא-הָיוּ-לָהּ עוֹד."], ["יט", "וַיַּשְׁכִּמוּ בַבֹּקֶר, וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה, וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל-בֵּיתָם, הָרָמָתָה; וַיֵּדַע אֶלְקָנָה אֶת-חַנָּה אִשְׁתּוֹ, וַיִּזְכְּרֶהָ יְהוָה."], ["כ", "וַיְהִי לִתְקֻפוֹת הַיָּמִים, וַתַּהַר חַנָּה וַתֵּלֶד בֵּן; וַתִּקְרָא אֶת-שְׁמוֹ שְׁמוּאֵל, כִּי מֵיְהוָה שְׁאִלְתִּיו."], ["כא", "וַיַּעַל הָאִישׁ אֶלְקָנָה, וְכָל-בֵּיתוֹ, לִזְבֹּחַ לַיהוָה אֶת-זֶבַח הַיָּמִים, וְאֶת-נִדְרוֹ."], ["כב", "וְחַנָּה, לֹא עָלָתָה: כִּי-אָמְרָה לְאִישָׁהּ, עַד יִגָּמֵל הַנַּעַר וַהֲבִאֹתִיו וְנִרְאָה אֶת-פְּנֵי יְהוָה, וְיָשַׁב שָׁם, עַד-עוֹלָם."], ["כג", "וַיֹּאמֶר לָהּ אֶלְקָנָה אִישָׁהּ עֲשִׂי הַטּוֹב בְּעֵינַיִךְ, שְׁבִי עַד-גָּמְלֵךְ אֹתוֹ--אַךְ יָקֵם יְהוָה, אֶת-דְּבָרוֹ; וַתֵּשֶׁב הָאִשָּׁה וַתֵּינֶק אֶת-בְּנָהּ, עַד-גָּמְלָהּ אֹתוֹ."], ["כד", "וַתַּעֲלֵהוּ עִמָּהּ כַּאֲשֶׁר גְּמָלַתּוּ, בְּפָרִים שְׁלֹשָׁה וְאֵיפָה אַחַת קֶמַח וְנֵבֶל יַיִן, וַתְּבִאֵהוּ בֵית-יְהוָה, שִׁלוֹ; וְהַנַּעַר, נָעַר."], ["כה", "וַיִּשְׁחֲטוּ, אֶת-הַפָּר; וַיָּבִאוּ אֶת-הַנַּעַר, אֶל-עֵלִי."], ["כו", "וַתֹּאמֶר בִּי אֲדֹנִי, חֵי נַפְשְׁךָ אֲדֹנִי; אֲנִי הָאִשָּׁה, הַנִּצֶּבֶת עִמְּכָה בָּזֶה, לְהִתְפַּלֵּל, אֶל-יְהוָה."], ["כז", "אֶל-הַנַּעַר הַזֶּה, הִתְפַּלָּלְתִּי; וַיִּתֵּן יְהוָה לִי אֶת-שְׁאֵלָתִי, אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ."], ["כח", "וְגַם אָנֹכִי, הִשְׁאִלְתִּהוּ לַיהוָה, כָּל-הַיָּמִים אֲשֶׁר הָיָה, הוּא שָׁאוּל לַיהוָה; וַיִּשְׁתַּחוּ שָׁם, לַיהוָה."]], [["א", "וַתִּתְפַּלֵּל חַנָּה, וַתֹּאמַר, עָלַץ לִבִּי בַּיהוָה, רָמָה קַרְנִי בַּיהוָה; רָחַב פִּי עַל-אוֹיְבַי, כִּי שָׂמַחְתִּי בִּישׁוּעָתֶךָ."], ["ב", "אֵין-קָדוֹשׁ כַּיהוָה, כִּי אֵין בִּלְתֶּךָ; וְאֵין צוּר, כֵּאלֹהֵינוּ."], ["ג", "אַל-תַּרְבּוּ תְדַבְּרוּ גְּבֹהָה גְבֹהָה, יֵצֵא עָתָק מִפִּיכֶם: כִּי אֵל דֵּעוֹת יְהוָה, ולא וְלוֹ נִתְכְּנוּ עֲלִלוֹת."], ["ד", "קֶשֶׁת גִּבֹּרִים, חַתִּים; וְנִכְשָׁלִים, אָזְרוּ חָיִל."], ["ה", "שְׂבֵעִים בַּלֶּחֶם נִשְׂכָּרוּ, וּרְעֵבִים חָדֵלּוּ, עַד-עֲקָרָה יָלְדָה שִׁבְעָה, וְרַבַּת בָּנִים אֻמְלָלָה."], ["ו", "יְהוָה, מֵמִית וּמְחַיֶּה; מוֹרִיד שְׁאוֹל, וַיָּעַל."], ["ז", "יְהוָה, מוֹרִישׁ וּמַעֲשִׁיר; מַשְׁפִּיל, אַף-מְרוֹמֵם."], ["ח", "מֵקִים מֵעָפָר דָּל, מֵאַשְׁפֹּת יָרִים אֶבְיוֹן, לְהוֹשִׁיב עִם-נְדִיבִים, וְכִסֵּא כָבוֹד יַנְחִלֵם: כִּי לַיהוָה מְצֻקֵי אֶרֶץ, וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל."], ["ט", "רַגְלֵי חֲסִידָו יִשְׁמֹר, וּרְשָׁעִים בַּחֹשֶׁךְ יִדָּמּוּ: כִּי-לֹא בְכֹחַ, יִגְבַּר-אִישׁ."], ["י", "יְהוָה יֵחַתּוּ מְרִיבָו, עָלָו בַּשָּׁמַיִם יַרְעֵם--יְהוָה, יָדִין אַפְסֵי-אָרֶץ; וְיִתֶּן-עֹז לְמַלְכּוֹ, וְיָרֵם קֶרֶן מְשִׁיחוֹ."], ["יא", "וַיֵּלֶךְ אֶלְקָנָה הָרָמָתָה, עַל-בֵּיתוֹ; וְהַנַּעַר, הָיָה מְשָׁרֵת אֶת-יְהוָה, אֶת-פְּנֵי, עֵלִי הַכֹּהֵן."], ["יב", "וּבְנֵי עֵלִי, בְּנֵי בְלִיָּעַל: לֹא יָדְעוּ, אֶת-יְהוָה."], ["יג", "וּמִשְׁפַּט הַכֹּהֲנִים, אֶת-הָעָם--כָּל-אִישׁ זֹבֵחַ זֶבַח, וּבָא נַעַר הַכֹּהֵן כְּבַשֵּׁל הַבָּשָׂר, וְהַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם, בְּיָדוֹ."], ["יד", "וְהִכָּה בַכִּיּוֹר אוֹ בַדּוּד, אוֹ בַקַּלַּחַת אוֹ בַפָּרוּר--כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג, יִקַּח הַכֹּהֵן בּוֹ; כָּכָה יַעֲשׂוּ לְכָל-יִשְׂרָאֵל, הַבָּאִים שָׁם בְּשִׁלֹה."], ["טו", "גַּם, בְּטֶרֶם יַקְטִרוּן אֶת-הַחֵלֶב, וּבָא נַעַר הַכֹּהֵן וְאָמַר לָאִישׁ הַזֹּבֵחַ, תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן; וְלֹא-יִקַּח מִמְּךָ בָּשָׂר מְבֻשָּׁל, כִּי אִם-חָי."], ["טז", "וַיֹּאמֶר אֵלָיו הָאִישׁ, קַטֵּר יַקְטִירוּן כַּיּוֹם הַחֵלֶב, וְקַח-לְךָ, כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ; וְאָמַר לו לֹא, כִּי עַתָּה תִתֵּן--וְאִם-לֹא, לָקַחְתִּי בְחָזְקָה."], ["יז", "וַתְּהִי חַטַּאת הַנְּעָרִים גְּדוֹלָה מְאֹד, אֶת-פְּנֵי יְהוָה: כִּי נִאֲצוּ הָאֲנָשִׁים, אֵת מִנְחַת יְהוָה."], ["יח", "וּשְׁמוּאֵל, מְשָׁרֵת אֶת-פְּנֵי יְהוָה: נַעַר, חָגוּר אֵפוֹד בָּד."], ["יט", "וּמְעִיל קָטֹן תַּעֲשֶׂה-לּוֹ אִמּוֹ, וְהַעַלְתָה לוֹ מִיָּמִים יָמִימָה--בַּעֲלוֹתָהּ, אֶת-אִישָׁהּ, לִזְבֹּחַ, אֶת-זֶבַח הַיָּמִים."], ["כ", "וּבֵרַךְ עֵלִי אֶת-אֶלְקָנָה וְאֶת-אִשְׁתּוֹ, וְאָמַר יָשֵׂם יְהוָה לְךָ זֶרַע מִן-הָאִשָּׁה הַזֹּאת, תַּחַת הַשְּׁאֵלָה, אֲשֶׁר שָׁאַל לַיהוָה; וְהָלְכוּ, לִמְקוֹמוֹ."], ["כא", "כִּי-פָקַד יְהוָה אֶת-חַנָּה, וַתַּהַר וַתֵּלֶד שְׁלֹשָׁה-בָנִים וּשְׁתֵּי בָנוֹת; וַיִּגְדַּל הַנַּעַר שְׁמוּאֵל, עִם-יְהוָה."], ["כב", "וְעֵלִי, זָקֵן מְאֹד; וְשָׁמַע, אֵת כָּל-אֲשֶׁר יַעֲשׂוּן בָּנָיו לְכָל-יִשְׂרָאֵל, וְאֵת אֲשֶׁר-יִשְׁכְּבוּן אֶת-הַנָּשִׁים, הַצֹּבְאוֹת פֶּתַח אֹהֶל מוֹעֵד."], ["כג", "וַיֹּאמֶר לָהֶם, לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה, אֲשֶׁר אָנֹכִי שֹׁמֵעַ אֶת-דִּבְרֵיכֶם רָעִים, מֵאֵת כָּל-הָעָם אֵלֶּה."], ["כד", "אַל, בָּנָי: כִּי לוֹא-טוֹבָה הַשְּׁמֻעָה אֲשֶׁר אָנֹכִי שֹׁמֵעַ, מַעֲבִרִים עַם-יְהוָה."], ["כה", "אִם-יֶחֱטָא אִישׁ לְאִישׁ, וּפִלְלוֹ אֱלֹהִים, וְאִם לַיהוָה יֶחֱטָא-אִישׁ, מִי יִתְפַּלֶּל-לוֹ; וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם, כִּי-חָפֵץ יְהוָה לַהֲמִיתָם."], ["כו", "וְהַנַּעַר שְׁמוּאֵל, הֹלֵךְ וְגָדֵל וָטוֹב: גַּם, עִם-יְהוָה, וְגַם, עִם-אֲנָשִׁים."], ["כז", "וַיָּבֹא אִישׁ-אֱלֹהִים, אֶל-עֵלִי; וַיֹּאמֶר אֵלָיו, כֹּה אָמַר יְהוָה, הֲנִגְלֹה נִגְלֵיתִי אֶל-בֵּית אָבִיךָ, בִּהְיוֹתָם בְּמִצְרַיִם לְבֵית פַּרְעֹה."], ["כח", "וּבָחֹר אֹתוֹ מִכָּל-שִׁבְטֵי יִשְׂרָאֵל לִי, לְכֹהֵן, לַעֲלוֹת עַל-מִזְבְּחִי לְהַקְטִיר קְטֹרֶת לָשֵׂאת אֵפוֹד, לְפָנָי; וָאֶתְּנָה לְבֵית אָבִיךָ, אֶת-כָּל-אִשֵּׁי בְּנֵי יִשְׂרָאֵל."], ["כט", "לָמָּה תִבְעֲטוּ, בְּזִבְחִי וּבְמִנְחָתִי, אֲשֶׁר צִוִּיתִי, מָעוֹן; וַתְּכַבֵּד אֶת-בָּנֶיךָ, מִמֶּנִּי, לְהַבְרִיאֲכֶם מֵרֵאשִׁית כָּל-מִנְחַת יִשְׂרָאֵל, לְעַמִּי."], ["ל", "לָכֵן, נְאֻם-יְהוָה אֱלֹהֵי יִשְׂרָאֵל, אָמוֹר אָמַרְתִּי, בֵּיתְךָ וּבֵית אָבִיךָ יִתְהַלְּכוּ לְפָנַי עַד-עוֹלָם; וְעַתָּה נְאֻם-יְהוָה חָלִילָה לִּי, כִּי-מְכַבְּדַי אֲכַבֵּד וּבֹזַי יֵקָלּוּ."], ["לא", "הִנֵּה, יָמִים בָּאִים, וְגָדַעְתִּי אֶת-זְרֹעֲךָ, וְאֶת-זְרֹעַ בֵּית אָבִיךָ--מִהְיוֹת זָקֵן, בְּבֵיתֶךָ."], ["לב", "וְהִבַּטְתָּ צַר מָעוֹן, בְּכֹל אֲשֶׁר-יֵיטִיב אֶת-יִשְׂרָאֵל; וְלֹא-יִהְיֶה זָקֵן בְּבֵיתְךָ, כָּל-הַיָּמִים."], ["לג", "וְאִישׁ, לֹא-אַכְרִית לְךָ מֵעִם מִזְבְּחִי, לְכַלּוֹת אֶת-עֵינֶיךָ, וְלַאֲדִיב אֶת-נַפְשֶׁךָ; וְכָל-מַרְבִּית בֵּיתְךָ, יָמוּתוּ אֲנָשִׁים."], ["לד", "וְזֶה-לְּךָ הָאוֹת, אֲשֶׁר יָבֹא אֶל-שְׁנֵי בָנֶיךָ--אֶל-חָפְנִי, וּפִינְחָס: בְּיוֹם אֶחָד, יָמוּתוּ שְׁנֵיהֶם."], ["לה", "וַהֲקִימֹתִי לִי כֹּהֵן נֶאֱמָן, כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה; וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן, וְהִתְהַלֵּךְ לִפְנֵי-מְשִׁיחִי כָּל-הַיָּמִים."], ["לו", "וְהָיָה, כָּל-הַנּוֹתָר בְּבֵיתְךָ, יָבוֹא לְהִשְׁתַּחֲוֺת לוֹ, לַאֲגוֹרַת כֶּסֶף וְכִכַּר-לָחֶם; וְאָמַר, סְפָחֵנִי נָא אֶל-אַחַת הַכְּהֻנּוֹת--לֶאֱכֹל פַּת-לָחֶם."]], [["א", "וְהַנַּעַר שְׁמוּאֵל מְשָׁרֵת אֶת-יְהוָה, לִפְנֵי עֵלִי; וּדְבַר-יְהוָה, הָיָה יָקָר בַּיָּמִים הָהֵם--אֵין חָזוֹן, נִפְרָץ."], ["ב", "וַיְהִי בַּיּוֹם הַהוּא, וְעֵלִי שֹׁכֵב בִּמְקוֹמוֹ; וְעֵינָו הֵחֵלּוּ כֵהוֹת, לֹא יוּכַל לִרְאוֹת."], ["ג", "וְנֵר אֱלֹהִים טֶרֶם יִכְבֶּה, וּשְׁמוּאֵל שֹׁכֵב, בְּהֵיכַל יְהוָה, אֲשֶׁר-שָׁם אֲרוֹן אֱלֹהִים."], ["ד", "וַיִּקְרָא יְהוָה אֶל-שְׁמוּאֵל, וַיֹּאמֶר הִנֵּנִי."], ["ה", "וַיָּרָץ אֶל-עֵלִי, וַיֹּאמֶר הִנְנִי כִּי-קָרָאתָ לִּי, וַיֹּאמֶר לֹא-קָרָאתִי, שׁוּב שְׁכָב; וַיֵּלֶךְ, וַיִּשְׁכָּב."], ["ו", "וַיֹּסֶף יְהוָה, קְרֹא עוֹד שְׁמוּאֵל, וַיָּקָם שְׁמוּאֵל וַיֵּלֶךְ אֶל-עֵלִי, וַיֹּאמֶר הִנְנִי כִּי קָרָאתָ לִי; וַיֹּאמֶר לֹא-קָרָאתִי בְנִי, שׁוּב שְׁכָב."], ["ז", "וּשְׁמוּאֵל, טֶרֶם יָדַע אֶת-יְהוָה; וְטֶרֶם יִגָּלֶה אֵלָיו, דְּבַר-יְהוָה."], ["ח", "וַיֹּסֶף יְהוָה קְרֹא-שְׁמוּאֵל, בַּשְּׁלִישִׁת, וַיָּקָם וַיֵּלֶךְ אֶל-עֵלִי, וַיֹּאמֶר הִנְנִי כִּי קָרָאתָ לִי; וַיָּבֶן עֵלִי, כִּי יְהוָה קֹרֵא לַנָּעַר."], ["ט", "וַיֹּאמֶר עֵלִי לִשְׁמוּאֵל, לֵךְ שְׁכָב, וְהָיָה אִם-יִקְרָא אֵלֶיךָ, וְאָמַרְתָּ דַּבֵּר יְהוָה כִּי שֹׁמֵעַ עַבְדֶּךָ; וַיֵּלֶךְ שְׁמוּאֵל, וַיִּשְׁכַּב בִּמְקוֹמוֹ."], ["י", "וַיָּבֹא יְהוָה וַיִּתְיַצַּב, וַיִּקְרָא כְפַעַם-בְּפַעַם שְׁמוּאֵל שְׁמוּאֵל; וַיֹּאמֶר שְׁמוּאֵל דַּבֵּר, כִּי שֹׁמֵעַ עַבְדֶּךָ."], ["יא", "וַיֹּאמֶר יְהוָה אֶל-שְׁמוּאֵל, הִנֵּה אָנֹכִי עֹשֶׂה דָבָר בְּיִשְׂרָאֵל: אֲשֶׁר, כָּל-שֹׁמְעוֹ--תְּצִלֶּינָה, שְׁתֵּי אָזְנָיו."], ["יב", "בַּיּוֹם הַהוּא אָקִים אֶל-עֵלִי, אֵת כָּל-אֲשֶׁר דִּבַּרְתִּי אֶל-בֵּיתוֹ--הָחֵל, וְכַלֵּה."], ["יג", "וְהִגַּדְתִּי לוֹ, כִּי-שֹׁפֵט אֲנִי אֶת-בֵּיתוֹ עַד-עוֹלָם--בַּעֲוֺן אֲשֶׁר-יָדַע, כִּי-מְקַלְלִים לָהֶם בָּנָיו, וְלֹא כִהָה, בָּם."], ["יד", "וְלָכֵן נִשְׁבַּעְתִּי, לְבֵית עֵלִי: אִם-יִתְכַּפֵּר עֲוֺן בֵּית-עֵלִי, בְּזֶבַח וּבְמִנְחָה--עַד-עוֹלָם."], ["טו", "וַיִּשְׁכַּב שְׁמוּאֵל עַד-הַבֹּקֶר, וַיִּפְתַּח אֶת-דַּלְתוֹת בֵּית-יְהוָה; וּשְׁמוּאֵל יָרֵא, מֵהַגִּיד אֶת-הַמַּרְאָה אֶל-עֵלִי."], ["טז", "וַיִּקְרָא עֵלִי אֶת-שְׁמוּאֵל, וַיֹּאמֶר שְׁמוּאֵל בְּנִי; וַיֹּאמֶר, הִנֵּנִי."], ["יז", "וַיֹּאמֶר, מָה הַדָּבָר אֲשֶׁר דִּבֶּר אֵלֶיךָ--אַל-נָא תְכַחֵד, מִמֶּנִּי: כֹּה יַעֲשֶׂה-לְּךָ אֱלֹהִים, וְכֹה יוֹסִיף, אִם-תְּכַחֵד מִמֶּנִּי דָּבָר, מִכָּל-הַדָּבָר אֲשֶׁר-דִּבֶּר אֵלֶיךָ."], ["יח", "וַיַּגֶּד-לוֹ שְׁמוּאֵל אֶת-כָּל-הַדְּבָרִים, וְלֹא כִחֵד מִמֶּנּוּ; וַיֹּאמַר--יְהוָה הוּא, הַטּוֹב בְּעֵינָו יַעֲשֶׂה."], ["יט", "וַיִּגְדַּל, שְׁמוּאֵל; וַיהוָה הָיָה עִמּוֹ, וְלֹא-הִפִּיל מִכָּל-דְּבָרָיו אָרְצָה."], ["כ", "וַיֵּדַע, כָּל-יִשְׂרָאֵל, מִדָּן, וְעַד-בְּאֵר שָׁבַע: כִּי נֶאֱמָן שְׁמוּאֵל, לְנָבִיא לַיהוָה."], ["כא", "וַיֹּסֶף יְהוָה, לְהֵרָאֹה בְשִׁלֹה: כִּי-נִגְלָה יְהוָה אֶל-שְׁמוּאֵל בְּשִׁלוֹ, בִּדְבַר יְהוָה."]]];
const questions = [[["2", "מִי הָיוּ שְׁתֵּי נְשׁוֹתָיו שֶׁל אֶלְקָנָה?", "חַנָּה וּפְנִנָּה", "חַנָּה וְרָחֵל", "לֵאָה וּפְנִנָּה", "בַּפָּסוּק כְּתוּב שֶׁשֵּׁם הָאַחַת חַנָּה, וְשֵׁם הַשֵּׁנִית פְּנִנָּה."], ["2", "מָה הָיָה הַהֶבְדֵּל בֵּין חַנָּה לִפְנִנָּה בִּתְחִלַּת הַפֶּרֶק?", "לִפְנִנָּה הָיוּ יְלָדִים, וּלְחַנָּה לֹא הָיוּ יְלָדִים", "לְחַנָּה הָיוּ יְלָדִים, וְלִפְנִנָּה לֹא הָיוּ", "לִשְׁתֵּיהֶן הָיוּ יְלָדִים", "חַנָּה הִתְפַּלְּלָה שֶׁיִּוָּלֵד לָהּ בֵּן. בְּסוֹף הַפֶּרֶק נוֹלַד שְׁמוּאֵל."], ["3", "לְאָן עָלָה אֶלְקָנָה בְּכָל שָׁנָה, וּמָה עָשָׂה שָׁם?", "לְשִׁלֹה, לְהִשְׁתַּחֲווֹת וְלִזְבֹּחַ לַה׳", "לָרָמָה, לִפְגֹּשׁ אֶת עֵלִי", "לְבֵית לֶחֶם, לְהָבִיא אֹכֶל לְמִשְׁפַּחְתּוֹ", "אֶלְקָנָה עָלָה לְשִׁלֹה, וְשָׁם שֵׁרְתוּ חָפְנִי וּפִינְחָס כַּכֹּהֲנִים."], ["6–7", "מַדּוּעַ בָּכְתָה חַנָּה וְלֹא אָכְלָה?", "פְּנִנָּה הִכְעִיסָה אוֹתָהּ עַל כָּךְ שֶׁלֹּא הָיוּ לָהּ יְלָדִים", "אֶלְקָנָה לֹא נָתַן לָהּ מָנָה", "עֵלִי אָמַר לָהּ לֹא לֶאֱכֹל", "חַנָּה הָיְתָה עֲצוּבָה מִפְּנֵי שֶׁלֹּא הָיוּ לָהּ יְלָדִים, וּפְנִנָּה הוֹסִיפָה לְצַעֲרָהּ."], ["8", "מָה אָמַר אֶלְקָנָה לְחַנָּה כְּדֵי לְעוֹדֵד אוֹתָהּ?", "״הֲלוֹא אָנֹכִי טוֹב לָךְ מֵעֲשָׂרָה בָּנִים״", "״לְכִי לְשָׁלוֹם״", "״דַּבֵּר כִּי שֹׁמֵעַ עַבְדֶּךָ״", "אֶלְקָנָה שָׁאַל לָמָּה חַנָּה בּוֹכָה, וְנִסָּה לְנַחֵם אוֹתָהּ."], ["11", "אֵיזֶה נֶדֶר נָדְרָה חַנָּה אִם יִוָּלֵד לָהּ בֵּן?", "הִיא תִּתֵּן אוֹתוֹ לַה׳ כָּל יָמָיו, וְתַעַר לֹא יַעֲלֶה עַל רֹאשׁוֹ", "הִיא תָּבִיא אוֹתוֹ לְשִׁלֹה רַק פַּעַם אַחַת", "הִיא תֻּשִּׁיב אוֹתוֹ בָּרָמָה כָּל חַיָּיו", "״וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ״ פֵּרוּשׁוֹ שֶׁלֹּא יְגַלְּחוּ אֶת שְׂעַר רֹאשׁוֹ."], ["12–16", "לָמָּה חָשַׁב עֵלִי שֶׁחַנָּה שִׁכּוֹרָה, וּמָה עָנְתָה לוֹ?", "שְׂפָתֶיהָ נָעוּ וְקוֹלָהּ לֹא נִשְׁמַע. הִיא אָמְרָה שֶׁלֹּא שָׁתְתָה וְשֶׁהִתְפַּלְּלָה מִתּוֹךְ צַעַר", "הוּא שָׁמַע אוֹתָהּ צוֹעֶקֶת. הִיא אָמְרָה שֶׁהִיא כוֹעֶסֶת עָלָיו", "הִיא הֶחֱזִיקָה יַיִן. הִיא אָמְרָה שֶׁשָּׁתְתָה מְעַט", "חַנָּה אָמְרָה לְעֵלִי ״וָאֶשְׁפֹּךְ אֶת נַפְשִׁי לִפְנֵי ה׳ מוּאֵל חָשַׁב שֶׁזּוֹ חַנָּה", "שְׁמוּאֵל רָץ אֶל עֵלִי, וְעֵלִי אָמַר לוֹ ״לֹא קָרָאתִי, שׁוּב שְׁכָב״."], ["4–8", "כַּמָּה פְּעָמִים קָרָא ה׳ לִשְׁמוּאֵל עַד שֶׁעֵלִי הֵבִין מִי קוֹרֵא לוֹ?", "שָׁלוֹשׁ פְּעָמִים", "שְׁתֵּי פְּעָמִים", "אַרְבַּע פְּעָמִים", "אַחֲרֵי הַקְּרִיאָה הַשְּׁלִישִׁית עֵלִי הֵבִין. בַּקְּרִיאָה הָרְבִיעִית שְׁמוּאֵל עָנָה לַה׳."], ["9–10", "מָה לִמֵּד עֵלִי אֶת שְׁמוּאֵל לוֹמַר כְּשֶׁיִּשְׁמַע שׁוּב אֶת הַקּוֹל?", "״דַּבֵּר ה׳ כִּי שֹׁמֵעַ עַבְדֶּךָ״", "״הִנְנִי כִּי קָרָאתָ לִּי״", "״לֹא קָרָאתִי, שׁוּב שְׁכָב״", "בְּפָסוּק י׳ שְׁמוּאֵל עוֹנֶה ״דַּבֵּר כִּי שֹׁמֵעַ עַבְדֶּךָ״."], ["11–14", "מָה אָמַר ה׳ לִשְׁמוּאֵל עַל בֵּית עֵלִי?", "הוּא יַעֲנִישׁ אֶת בֵּית עֵלִי עַל מַעֲשֵׂי בָנָיו, וְעַל כָּךְ שֶׁעֵלִי לֹא עָצַר אוֹתָם", "הוּא יִתֵּן לִבְנֵי עֵלִי פְּרָס עַל מַעֲשֵׂיהֶם", "הוּא יִשְׁלַח אֶת עֵלִי לִהְיוֹת נָבִיא בָּרָמָה", "ה׳ אָמַר שֶׁיְּקַיֵּם אֶת דְּבָרוֹ עַל בֵּית עֵלִי, וְשֶׁזֶּבַח וּמִנְחָה לֹא יְכַפְּרוּ עַל הֶעָווֹן."], ["11–15", "מַדּוּעַ פָּחַד שְׁמוּאֵל לְסַפֵּר לְעֵלִי אֶת הַמַּרְאָה?", "כִּי שָׁמַע בְּשׂוֹרָה קָשָׁה עַל עֵלִי וְעַל בֵּיתוֹ", "כִּי שָׁכַח אֶת כָּל מַה שֶּׁשָּׁמַע", "כִּי עֵלִי אָסַר עָלָיו לְדַבֵּר", "הַפָּסוּק מְסַפֵּר עַל הַפַּחַד. תֹּכֶן הַנְּבוּאָה עוֹזֵר לְהָבִין אוֹתוֹ."], ["16–18", "מָה בִּקֵּשׁ עֵלִי מִשְּׁמוּאֵל לְסַפֵּר לוֹ?", "אֶת כָּל מַה שֶּׁנֶּאֱמַר לוֹ, בְּלִי לְהַסְתִּיר דָּבָר", "רַק אֶת הַבְּשׂוֹרוֹת הַטּוֹבוֹת", "אֵיךְ פָּתַח אֶת דַּלְתוֹת בֵּית ה׳", "״אַל נָא תְכַחֵד מִמֶּנִּי״ פֵּרוּשׁוֹ אַל תַּסְתִּיר מִמֶּנִּי."], ["18", "מָה עָנָה עֵלִי לְאַחַר שֶׁשָּׁמַע אֶת דִּבְרֵי ה׳?", "״ה׳ הוּא, הַטּוֹב בְּעֵינָו יַעֲשֶׂה״", "״דַּבֵּר, כִּי שֹׁמֵעַ עַבְדֶּךָ״", "״לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה״", "עֵלִי קִבֵּל אֶת דִּבְרֵי ה׳."], ["19–21", "מָה מְסַפֵּר סוֹף הַפֶּרֶק עַל גְּדִילַת שְׁמוּאֵל וְעַל מַעֲמָדוֹ?", "ה׳ הָיָה עִמּוֹ, דְּבָרָיו הִתְקַיְּמוּ, וְכָל יִשְׂרָאֵל יָדְעוּ שֶׁהוּא נָבִיא לַה׳", "הוּא הָיָה לְמֶלֶךְ יִשְׂרָאֵל וּפָסַק מִלְּהִתְנַבֵּא", "הוּא חָזַר לְבֵית אִמּוֹ וְהִפְס const chapters=[
 {l:'א', title:'חַנָּה וְהֻלֶּדֶת שְׁמוּאֵל',caption:'הַתְּפִלָּה, הַנֶּדֶר וְהַדֶּרֶךְ לְשִׁלֹה', summary:'לְחַנָּה אֵין יְלָדִים. הִיא מִתְפַּלֶּלֶת בְּשִׁלֹה וְנוֹדֶרֶת לְהַקְדִּישׁ לַה׳ אֶת בְּנָהּ אִם יִוָּלֵד לָהּ בֵּן. כְּשֶׁשְּׁמוּאֵל נִגְמָל, הִיא מְבִיאָה אוֹתוֹ אֶל עֵלִי וּמְקַיֶּמֶת אֶת נִדְרָהּ.', terms:[['נֶדֶר','הַבְטָחָה מְחַיֶּבֶת.'],['מָרַת נָפֶשׁ','עֲצוּבָה מְאֹד.'],['נִגְמַל','הִפְסִיק לִינֹק.']]},
 {l:'ב', title:'תְּפִלַּת חַנָּה וּבְנֵי עֵלִי',caption:'תְּפִלַּת הוֹדָיָה, שֵׁרוּת וְאַחְרָיוּת', summary:'חַנָּה מִתְפַּלֶּלֶת תְּפִלַּת הוֹדָיָה. שְׁמוּאֵל מְשָׁרֵת לִפְנֵי ה׳, וְאִמּוֹ מְבִיאָה לוֹ מְעִיל בְּכָל שָׁנָה. בְּנֵי עֵלִי מִתְנַהֲגִים בְּדֶרֶךְ פְּסוּלָה. עֵלִי מוֹכִיחַ אוֹתָם, וְאִישׁ אֱלֹהִים מוֹדִיעַ לוֹ שֶׁבֵּיתוֹ יֵעָנֵשׁ.', terms:[['עָלַץ','שָׂמַח מְאֹד.'],['אֵפוֹד בָּד','בֶּגֶד בַּד שֶׁשְּׁמוּאֵל לָבַשׁ בַּשֵּׁרוּת.'],['חֵלֶב','חֵלֶק שׁוּמָנִי מִן הַקָּרְבָּן.']]},
 {l:'ג', title:'הַקְּרִיאָה לִשְׁמוּאֵל',caption:'קוֹל בַּלַּיְלָה וּנְבוּאָה רִאשׁוֹנָה', summary:'שְׁמוּאֵל שׁוֹמֵעַ קוֹל בַּלַּיְלָה וְחוֹשֵׁב שֶׁעֵלִי קָרָא לוֹ. אַחֲרֵי שָׁלוֹשׁ קְרִיאוֹת, עֵלִי מֵבִין שֶׁה׳ קוֹרֵא לַנַּעַר. שְׁמוּאֵל מְקַבֵּל נְבוּאָה עַל בֵּית עֵלִי וּמְסַפֵּר לוֹ אֶת כָּל מַה שֶּׁשָּׁמַע.', terms:[['יָקָר','נָדִיר.'],['אֵין חָזוֹן נִפְרָץ','נְבוּאָה לֹא הָיְתָה שְׁכִיחָה.'],['תְכַחֵד','תַּסְתִּיר.']]}
];
const view=document.querySelector('#view'), status=document.querySelector('#status');
let page='home', ch=0, session=null, returnPage=null;
const storageKey='samuel-study-v1';
let history={};
try {history=JSON.parse(localStorage.getItem(storageKey))||{}} catch {}
function remember(key,val){history[key]=val;try{localStorage.setItem(storageKey,JSON.stringify(history))}catch{}}
function button(label,action,classes='',attrs=''){return '<button data-act="'+action+'" class="'+classes+'" '+attrs+'>'+label+'</button>'}
function jump(){view.scrollIntoView({block:'start'});view.querySelector('h2')?.focus({preventScroll:true})}
function speak(value){
 status.textContent='';
 const synth=window.speechSynthesis;
 if(!synth){status.textContent='הַדַּפְדְּפָן אֵינוֹ תּוֹמֵךְ בְּהַקְרָאָה.';return}
 synth.cancel();
 document.querySelector('audio')?.pause();
 const voice=synth.getVoices().filter(v=>/^he(?:[-_]|$)|^iw(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>Number(b.localService)-Number(a.localService))[0];
 if(!voice){status.textContent='לֹא נִמְצָא קוֹל בְּעִבְרִית בַּדַּפְדְּפָן. בְּמַסַּךְ הַקְּרִיאָה יֵשׁ הַקְלָטָה לְכָל פֶּרֶק.';return}
 const speech=value.replace(/([בלמכ])([\u05b0-\u05bc]*)ה׳/g,'$1$2שֵּׁם').replaceAll('ה׳','הַשֵּׁם');
 const parts=speech.split(/(?<=[.?!])\s+/).filter(Boolean).map(line=>{
   const saying=new SpeechSynthesisUtterance(line);
   saying.voice=voice;saying.lang=voice.lang;saying.rate=.82;
   saying.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))status.textContent='הַהַקְרָאָה לֹא הִצְלִיחָה בַּמַּכְשִׁיר הַזֶּה.'};
   return saying;
 });
 parts.forEach(part=>synth.speak(part));
}
function selectChips(action,selected){return '<div class="chips">'+chapters.map((c,i)=>button('פֶּרֶק '+c.l+'׳',action,selected===i?'active':'','data-n="'+i+'" aria-pressed="'+(selected===i)+'"')).join('')+'</div>'}
function title(text){return '<h2 tabindex="-1">'+text+'</h2>'}
function nav(to,scroll=true){
 window.speechSynthesis?.cancel();status.textContent='';page=to;
 document.querySelector('#hero').hidden=page!=='home';
 document.querySelectorAll('.nav button').forEach(b=>{
   const active=b.dataset.act===(page==='quiz'?session.mode:page);
   b.classList.toggle('active',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
 });
 if(to==='home')renderHome();
 if(to==='read')read();
 if(to==='practice'||to==='exam')setup(to);
 if(to==='quiz')quiz();
 if(scroll){if(to==='home')window.scrollTo(0,0);else jump()}
}
function renderHome(){
 view.innerHTML='<div class="section-title">'+title('בּוֹחֲרִים פֶּרֶק')+'<span class="note muted">85 פְּסוּקִים</span></div><div class="cards">'+chapters.map((c,i)=>'<button class="chapter" data-act="chapter" data-n="'+i+'"><span class="letter">'+c.l+'׳</span><strong>'+c.title+'</strong><span class="caption">'+c.caption+'</span></button>').join('')+'</div><div class="panel soft bar"><div><h2>מוּכָנִים לְתַרְגֵּל?</h2><p>30 שְׁאֵלוֹת לְפִי דַּף הַחֲזָרָה.</p></div><div class="row">'+button('תִּרְגּוּל','practice','primary')+button('מִבְחָן','exam')+'</div></div>';
}
function read(){
 const c=chapters[ch], base='https://mechon-mamre.org/mp3/t08a0'+(ch+1)+'.mp3';
 view.innerHTML=(returnPage?'<div class="return-bar">'+button('חֲזָרָה לַשְּׁאֵלָה','backQuestion','primary')+'</div>':'')+selectChips('chapter',ch)+'<section class="panel soft"><div class="bar">'+title(c.title)+button('הַקְרָאַת תַּקְצִיר','summary')+'</div><p style="margin:.6rem 0">'+c.summary+'</p><details><summary>מִלִּים שֶׁכְּדַאי לְהַכִּיר</summary><dl class="gloss">'+c.terms.map(t=>'<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>').join('')+'</dl></details></section><section class="panel"><div class="bar"><h3>פֶּרֶק '+c.l+'׳ · כָּל הַפְּסוּקִים</h3></div><div class="audio"><p><strong>הַאֲזָנָה לְפֶרֶק הַמָּלֵא</strong></p><audio controls preload="none" src="'+base+'" aria-label="הַאֲזָנָה לְפֶרֶק '+c.l+'׳"></audio><a href="'+base+'" target="_blank" rel="noopener">פְּתִיחַת הַהַקְלָטָה בְּחַלּוֹן נִפְרָד</a></div><ol class="verses">'+verses[ch].map(([n,t],i)=>'<li class="verse" id="v'+(i+1)+'"><b>'+n+'</b><span>'+t+'</span></li>').join('')+'</ol></section>';
 const audio=view.querySelector('audio');
 audio.onplay=()=>window.speechSynthesis?.cancel();
 audio.onerror=()=>{status.textContent='הַהַקְלָטָה לֹא נִטְעֲנָה. אֶפְשָׁר לִפְתֹּחַ אוֹתָהּ בְּחַלּוֹן נִפְרָד.'};
}
function setup(mode){
 const test=mode==='exam', best=history.best;
 view.innerHTML='<div class="panel">'+title(test?'מִבְחַן חֲזָרָה':'תִּרְגּוּל לִפְנֵי הַמִּבְחָן')+
 '<p class="muted">'+(test?'עוֹנִים עַל הַשְּׁאֵלוֹת וּמְקַבְּלִים צִיּוּן וְתִקּוּנִים בַּסּוֹף.':'עוֹנִים בַּקּוֹל אוֹ בּוֹחֲרִים תְּשׁוּבָה, וּמִיָּד רוֹאִים אֶת הַהֶסְבֵּר.')+'</p>'+
 '<h3>בְּחִירַת פְּרָקִים</h3><div class="row">'+button('כָּל הַפְּרָקִים · 30','start','primary','data-n="-1"')+chapters.map((c,i)=>button('פֶּרֶק '+c.l+'׳ · 10','start','','data-n="'+i+'"')).join('')+'</div>'+
 (test&&Number.isInteger(best)?'<p class="note muted" style="margin:13px 0 0">הַצִּיּוּן הַגָּבוֹהַּ בְּמִבְחַן הַמָּלֵא: '+best+'</p>':'')+'</div>';
}
function shuffled(list){
 const out=[...list];
 for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
 return out;
}
function start(mode,n){
 const source=questions.flatMap((items,c)=>items.map((q,i)=>({q,c,id:c*10+i}))).filter(item=>n<0||n===item.c);
 const items=(mode==='exam'?shuffled(source):source).map(item=>({...item,order:shuffled([0,1,2])}));
 session={mode,items,pos:0,pick:null,review:false,replies:[],done:false};
 nav('quiz');
}
function detail(item){const [ref,,correct,,,why]=item.q;return '<p><strong>'+correct+'</strong></p><p>'+why+'</p>'+button('לַפְּסוּקִים','source','','data-id="'+item.id+'" aria-label="לַפְּסוּקִים '+ref+'"')}
function quiz(){
 if(session.done){result();return}
 const {items,pos,pick,mode,review}=session;
 const item=items[pos], [,ask,...parts]=item.q, practice=mode==='practice';
 view.innerHTML='<section class="panel"><div class="bar">'+title(practice?'תִּרְגּוּל':'מִבְחָן')+'<span class="muted">שְׁאֵלָה '+(pos+1)+' מִתּוֹךְ '+items.length+' · פֶּרֶק '+chapters[item.c].l+'׳</span></div><progress class="meter" max="'+items.length+'" value="'+(pos+(review?1:0))+'" aria-label="הִתְקַדְּמוּת"></progress><h3 class="question">'+ask+'</h3><div class="row" style="margin-top:9px">'+button('הַקְרָאָה','speak')+button('עֲצִירַת הַקְרָאָה','stop')+'</div><div class="answers" role="group" aria-label="אֶפְשָׁרוּיוֹת תְּשׁוּבָה">'+item.order.map((i,index)=>button('<span class="letter-sm">'+['א','ב','ג'][index]+'</span>'+parts[i],'choose','option '+(review&&i===0?'right':review&&i===pick?'wrong':i===pick?'chosen':''),'data-n="'+i+'" aria-pressed="'+(i===pick)+'" '+(review?'disabled':''))).join('')+'</div>'+
 (review?'<div class="feedback '+(pick===0?'':'correction')+'" aria-live="polite"><strong>'+(pick===0?'נָכוֹן!':pick===null?'תְּשׁוּבַת הַדֻּגְמָה':'הַתְּשׁוּבָה הַנְּכוֹנָה')+'</strong>'+detail(item)+'</div>':'')+
 '<div class="row quiz-bottom">'+(practice&&!review?button('בְּדִיקָה','check','primary',pick===null?'disabled':'')+button('הַצָּגַת תְּשׁוּבָה','reveal'):button(pos+1===items.length?'לַתּוֹצָאוֹת':'הַשְּׁאֵלָה הַבָּאָה','next','primary',!practice&&pick===null?'disabled':''))+'</div></section>';
}
function result(){
 const {mode,items,replies}=session, good=replies.filter(a=>a===0).length;
 const grade=Math.round(100*good/items.length), test=mode==='exam';
 if(test&&items.length===30&&grade>(history.best??-1))remember('best',grade);
 view.innerHTML='<section class="panel">'+title(test?'תּוֹצְאוֹת הַמִּבְחָן':'סִיּוּם הַתִּרְגּוּל')+'<p class="score">'+(test?grade+' / 100':good+' / '+items.length)+'</p><p>'+good+' תְּשׁוּבוֹת נְכוֹנוֹת מִתּוֹךְ '+items.length+'.</p><div class="row">'+button('סִבּוּב נוֹסָף',mode,'primary')+button('לַמָּסָךְ הָרָאשִׁי','home')+'</div></section>'+
 '<section class="panel"><h3>חֲזָרָה עַל הַתְּשׁוּבוֹת</h3>'+items.map((item,i)=>'<details class="review"><summary><strong>'+(replies[i]===0?'נָכוֹן':'לַחֲזָרָה')+'</strong> · '+item.q[1]+'</summary>'+(replies[i]!==null?'<p>הַתְּשׁוּבָה שֶׁלִּי: '+item.q[2+replies[i]]+'</p>':'')+detail(item)+'</details>').join('')+'</section>';
}
document.addEventListener('click',e=>{
 const el=e.target.closest('button[data-act]');if(!el)return;
 const {act,n,id}=el.dataset;
 if(['home','read','practice','exam','chapter'].includes(act)){
   returnPage=null;
   if(act==='chapter'){ch=Number(n);nav('read')}else nav(act);
   return;
 }
 if(act==='summary'){speak(chapters[ch].summary);return}
 if(act==='stop'){window.speechSynthesis?.cancel();status.textContent='';return}
 if(act==='start'){start(page,Number(n));return}
 if(act==='backQuestion'){returnPage=null;nav('quiz');return}
 if(act==='source'){
   const item=session.items.find(q=>q.id===Number(id));
   const span=item.q[0].split('–').map(Number);
   ch=item.c;returnPage='quiz';nav('read',false);
   for(let i=span[0];i<=(span[1]??span[0]);i++)document.getElementById('v'+i)?.classList.add('hit');
   document.getElementById('v'+span[0])?.scrollIntoView({block:'center'});
   return;
 }
 const item=session.items[session.pos];
 if(act==='choose'){session.pick=Number(n);quiz();view.querySelector('.option.chosen')?.focus({preventScroll:true})}
 if(act==='speak'){
   const [,ask,...options]=item.q;
   speak(session.review?options[0]+'. '+options[3]:ask+' '+item.order.map((choice,i)=>['אֶפְשָׁרוּת אַחַת','אֶפְשָׁרוּת שְׁתַּיִם','אֶפְשָׁרוּת שָׁלוֹשׁ'][i]+': '+options[choice]+'.').join(' '));
 }
 if(act==='check'||act==='reveal'){
   if(act==='reveal')session.pick=null;
   session.review=true;quiz();view.querySelector('.feedback')?.scrollIntoView({block:'nearest'});
   view.querySelector('[data-act="next"]')?.focus({preventScroll:true});
 }
 if(act==='next'){
   window.speechSynthesis?.cancel();status.textContent='';
   session.replies.push(session.pick);session.pos+=1;session.review=false;session.pick=null;
   session.done=session.pos===session.items.length;quiz();jump();
 }
});
window.speechSynthesis?.getVoices();
nav('home',false);
</script>
</body>
</html>
