 [1,'עַד מָתַי קוֹרְאִים שְׁמַע בְּשַׁחֲרִית לְפִי תַּנָּא קַמָּא וּלְפִי רַבִּי יְהוֹשֻׁעַ?','לְתַנָּא קַמָּא, עַד הָנֵץ הַחַמָּה. לְרַבִּי יְהוֹשֻׁעַ, עַד שָׁלוֹשׁ שָׁעוֹת מִתְּחִלַּת הַיּוֹם לְפִי מִנְיַן שָׁעוֹת הַיּוֹם.','תַּנָּא קַמָּא: הָנֵץ הַחַמָּה. רַבִּי יְהוֹשֻׁעַ: שָׁלוֹשׁ שָׁעוֹת','תַּנָּא קַמָּא: שָׁלוֹשׁ שָׁעוֹת. רַבִּי יְהוֹשֻׁעַ: הָנֵץ הַחַמָּה','לְפִי שְׁנֵיהֶם עַד חֲצוֹת הַיּוֹם'],

function study(index){
 const topic=topics[index], ids=byTopic(index);
 mount('<section class="panel"><p class="muted">מִשְׁנָה '+topic.letter+'</p><h2>'+topic.name+'</h2>'+scene(topic)+'<div class="timeline">'+topic.visual+'</div><p>נַסּוּ לַעֲנוֹת בְּקוֹל, וְאָז פִּתְחוּ כָּל שְׁאֵלָה וּבִדְקוּ אֶת הַתְּשׁוּבָה.</p><div class="list">'+ids.map(i=>'<details class="answer"><summary>'+bank[i][1]+'</summary><p>'+bank[i][2]+'</p></details>').join('')+'</div>'+(index===2?'<p class="note">בִּשְׁאֵלָה 13 בַּדַּף הַחֲזָרָה נָפְלָה טָעוּת בְּשֵׁם הַדֵּעָה. רַבִּי טַרְפוֹן הִטָּה כְּדִבְרֵי בֵּית שַׁמַּאי, כְּפִי שֶׁמּוֹפִיעַ ב<a href="https://he.wikisource.org/wiki/משנה_ברכות_א_ג" target="_blank" rel="noopener">מִשְׁנָה בִּרְכוֹת א׳, ג׳</a>.</p>':'')+'<div class="actions"><button class="btn" id="practice">תִּרְגּוּל לַמִּשְׁנָה</button>'+(index<topics.length-1?'<button class="btn alt" id="next-topic">לַמִּשְׁנָה הַבָּאָה</button>':'')+'</div></section>');
 voiceStatus();
 app.querySelectorAll('details').forEach((card,j)=>{const row=bank[ids[j]];card.before(listenButton('שְׁמִיעַת הַשְּׁאֵלָה',row[1]));card.append(listenButton('שְׁמִיעַת הַתְּשׁוּבָה',row[2]))});
 document.querySelector('#practice').onclick=()=>start(ids,false);
 document.querySelector('#next-topic')?.addEventListener('click',()=>study(index+1));
}
function start(ids,exam){session={ids,exam,pos:0,results:[]};question()}
function question(){
 const {ids,pos,exam}=session, id=ids[pos], row=bank[id], topic=topics[row[0]];
 const choices=shuffle([3,4,5]);
 mount('<section class="panel"><div class="stat"><strong>'+(exam?'מִבְחָן דֶּמֶה':'תִּרְגּוּל')+' · שְׁאֵלָה '+(pos+1)+' מִתּוֹךְ '+ids.length+'</strong><div class="bar" role="progressbar" aria-label="שְׁאֵלוֹת שֶׁנֶּעֱנוּ" aria-valuenow="'+pos+'" aria-valuemax="'+ids.length+'"><span style="width:'+(pos/ids.length*100)+'%"></span></div></div><p class="muted">'+topic.name+'</p><h2>'+row[1]+'</h2><div class="list">'+choices.map(n=>'<button class="choice" data-choice="'+n+'">'+row[n]+'</button>').join('')+'</div><div id="feedback" role="status"></div><div class="actions"><button class="btn" id="next" hidden>'+(pos+1===ids.length?'לְסִכּוּם':'לַשְּׁאֵלָה הַבָּאָה')+'</button></div></section>');
 const next=document.querySelector('#next'), buttons=[...app.querySelectorAll('[data-choice]')];
 voiceStatus();app.querySelector('h2').after(listenButton('שְׁמִיעַת הַשְּׁאֵלָה',row[1]));
 for(const [j,button] of buttons.entries()){const box=document.createElement('div');box.className='option-row';button.before(box);box.append(button,listenButton('אֶפְשָׁרוּת '+['א׳','ב׳','ג׳'][j],row[button.dataset.choice]))}
 for(const button of buttons)button.onclick=()=>{
   const pick=Number(button.dataset.choice), correct=pick===3;
   session.results.push({id,pick,correct});progress[id]=correct;
   try{localStorage.setItem('berakhot-lab-v1',JSON.stringify(progress))}catch{}
   buttons.forEach(b=>{b.disabled=true;if(!exam&&Number(b.dataset.choice)===3)b.classList.add('good')});
   if(!exam&&!correct)button.classList.add('bad');
   document.querySelector('#feedback').innerHTML=exam?'<p class="muted">הַתְּשׁוּבָה נִרְשְׁמָה.</p>':'<div class="feedback '+(correct?'good':'bad')+'"><strong>'+(correct?'תְּשׁוּבָה נְכוֹנָה!':'הִנֵּה הַתְּשׁוּבָה הַנְּכוֹנָה')+'</strong><div>'+row[2]+'</div></div>';
   stopVoice();if(!exam)document.querySelector('#feedback').append(listenButton('שְׁמִיעַת הַהֶסְבֵּר',row[2]));
   next.hidden=false;next.focus();
 };
 next.onclick=()=>{session.pos++;if(session.pos===ids.length)finish();else question()};
}
function finish(){
 const {results,exam}=session, errors=results.filter(r=>!r.correct);
 mount('<section class="panel"><h2>'+(exam?'תּוֹצְאוֹת מִבְחָן הַדֶּמֶה':'סִכּוּם הַתִּרְגּוּל')+'</h2><div class="score">'+(results.length-errors.length)+' / '+results.length+'</div><p>'+(errors.length?'כְּדַאי לַחֲזֹר עַל הַשְּׁאֵלוֹת הַבָּאוֹת.':'כָּל הַתְּשׁוּבוֹת נְכוֹנוֹת!')+'</p>'+errors.map(({id,pick})=>'<div class="review"><strong>'+bank[id][1]+'</strong><p class="muted">הַתְּשׁוּבָה שֶׁבְּחַרְתֶּם: '+bank[id][pick]+'</p><p>'+bank[id][2]+'</p></div>').join('')+'<div class="actions">'+(errors.length?'<button class="btn" id="retry">לְתַרְגֵּל אֶת הַטָּעֻיּוֹת</button>':'')+'<button class="btn alt" id="back">לְדַף הַבַּיִת</button></div></section>');
 voiceStatus();app.querySelectorAll('.review').forEach((card,j)=>{const row=bank[errors[j].id];card.append(listenButton('שְׁמִיעַת הַשְּׁאֵלָה',row[1]),listenButton('שְׁמִיעַת הַתְּשׁוּבָה',row[2]))});
 document.querySelector('#retry')?.addEventListener('click',()=>start(errors.map(r=>r.id),false));
 document.querySelector('#back').onclick=home;
}
document.querySelector('#home').onclick=home;
home();
</script>
</body>
</html>
