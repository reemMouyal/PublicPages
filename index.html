<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אפליקציות לימוד</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; font: 1.125rem/1.6 system-ui, sans-serif; background: #f1f5ff; color: #13254a; }
    main { max-width: 40rem; margin: 8vh auto; padding: clamp(1.25rem, 5vw, 3rem); background: white; border-radius: 1.25rem; border: 1px solid #d9e3fa; }
    h1 { margin-block: 0 .5rem; line-height: 1.2; }
    p { margin-block: 0; }
  </style>
</head>
<body>
  <main>
    <h1>אפליקציות לימוד</h1>
    <p>אפליקציות הלימוד יופיעו כאן אחרי שיועלו.</p>
  </main>
</body>
</html>
