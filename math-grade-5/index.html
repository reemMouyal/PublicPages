ce;text-align:right}.vertical span{display:block;border-bottom:2px solid}details{margin:12px 0}summary{cursor:pointer}p{margin:10px 0}</style>

const topics=[
['חיבור וחיסור במאונך','±','מיישרים יחידות מתחת ליחידות ומתחילים מימין. כשסכום הספרות מגיע ל־10, מעבירים עשרת לעמודה הבאה. בחיסור אפשר לפרוט עשרת לעשר יחידות.'],
['שיבוץ ספרות','▦','כדי להגדיל סכום, משבצים ספרות גדולות במקומות בעלי הערך הגבוה ביותר. בחיסור מגדילים את המספר הראשון ומקטינים את השני. אסור להתחיל מספר רב־ספרתי באפס.'],
['כפל ב־99 וב־100','×','כפל ב־100 מזיז כל ספרה שני מקומות שמאלה בטבלת ערך המקום. כדי לכפול ב־99, כופלים ב־100 ומחסרים פעם אחת את המספר המקורי.'],
['אומדן משקל','≈','טונה אחת שווה לאלף קילוגרמים. בוחרים גבול עליון או תחתון נוח לכל משקל. אם אפילו הגבול העליון נכנס למעלית, לכולם יש מקום.'],

['סדר פעולות בשברים','÷','גם בשברים פועלים לפי סדר הפעולות. בכפל של שבר במספר שלם כופלים את המונה במספר השלם. בכל פעם שהמונה מגיע למכנה אפשר להרכיב שלם.'],
['בעיות מילוליות','?','מה מבקשים ובאילו יחידות? מוצאים קודם את הכמות החסרה. ״פי״ מכוון לכפל או לחילוק, ו״יותר ב־״ או ״פחות ב־״ להפרש. בסוף בודקים שענינו על השאלה.']

const bank=[
[['7567 + 124','7691','חברו קודם את היחידות.','7 ועוד 4 הם 11. כותבים 1 ומעבירים עשרת. בעשרות מתקבל 9, במאות 6 ובאלפים 7.'],['2832 − 324','2508','פרטו עשרת בעמודת היחידות.','12 פחות 4 הם 8. נשארו 2 עשרות, ומהן מחסרים 2. במאות נשארות 5.'],['3517 + 4175','7692','זכרו את העשרת העוברת.','7 ועוד 5 הם 12. בעשרות מחברים 1, 7 וגם 1 שעבר.'],['14111 − 11601','2510','בדקו אם צריך לפרוט אלף.','בעמודת המאות פורטים אלף. 11 מאות פחות 6 מאות הן 5 מאות.']],
[['מהו הסכום הגדול ביותר של מספר בן ארבע ספרות ומספר בן שלוש ספרות מהספרות 0, 2, 4, 5, 6, 8, 9? השתמשו בכל ספרה פעם אחת.','10492','שימו 9 באלפים ואת 8 ו־6 במאות.','למשל 9852 ועוד 640. מציבים את 9 באלפים, 8 ו־6 במאות, 5 ו־4 בעשרות, ו־2 ו־0 ביחידות.'],['מהו ההפרש הגדול ביותר בין מספר בן ארבע ספרות למספר בן שלוש ספרות מאותן הספרות (0, 2, 4, 5, 6, 8, 9), בשימוש חד־פעמי?','9661','התחילו במספר הגדול ביותר.','המספר הגדול הוא 9865. מהספרות שנותרו יוצרים 204. ההפרש הוא 9661.']],
[['375 × 99','37125','התחילו בכפל ב־100.','37500 פחות 375 הם 37125.'],['100 × □ = 2500','25','איזו פעולה הפוכה לכפל?','מחלקים 2500 ב־100 ומקבלים 25.'],['99 × 20','1980','כמה הם מאה פעמים עשרים?','2000 פחות 20 הם 1980.']],
[['שישה קרנפים שוקלים כל אחד יותר מ־1,700 ק״ג. מעלית נושאת 9 טונות. האם כולם יכולים לעלות יחד?','לא','השוו את המשקל המזערי למגבלה.','שישה כפול 1700 הם 10200 ק״ג. אפילו הגבול התחתון גדול מ־9000.'],['ארבעה פילים שוקלים 5,490, 6,000, 5,950 ו־6,050 ק״ג. האם מעלית של 24 טונות יכולה לשאת אותם?','כן','חשבו כמה חסר לכל פיל עד 6000 ק״ג וכמה עודף.','העודף של 50 מתקזז עם החוסר של 50. הפיל הראשון קל ב־510 ק״ג מ־6000. יחד הם שוקלים פחות מ־24000.']],
[['8500 + 4000 ÷ 2','10500','התחילו בחילוק.','4000 חלקי 2 הם 2000. מוסיפים 8500.'],['(4500 − 2300) × 2','4400','מתחילים בתוך הסוגריים.','ההפרש הוא 2200. כפול 2 מתקבל 4400.'],['5000 − 1200 × 2 × 2 + 100','300','בצעו את שני תרגילי הכפל.','המכפלה היא 4800. מחסרים אותה מ־5000 ומוסיפים 100.']],
[['4 3/7 + 5/7','5 1/7','כמה שביעיות יוצרות שלם?','3 ועוד 5 הן 8 שביעיות. שבע מהן יוצרות שלם, ונשארת שביעית אחת.'],['4 3/7 − 3 6/7','4/7','החליפו שלם אחד בשביעיות.','ארבעה ושלוש שביעיות הם שלושה ועשר שביעיות. לאחר החיסור נשארות ארבע שביעיות.'],['2 1/7 + □ = 4 3/7','2 2/7','מצאו את ההפרש בין הסכום למחובר הידוע.','4 פחות 2 הם 2. שלוש שביעיות פחות שביעית הן שתי שביעיות.'],['1/7 × □ = 4 3/7','31','המירו את השלמים לשביעיות.','בארבעה שלמים יש 28 שביעיות. עם שלוש נוספות מתקבלות 31.'],['2/7 + 2 + □ = 4 3/7','2 1/7','איזה מספר מעורב ישלים את הסכום?','אחרי שמחסרים שני שלמים ושתי שביעיות נשארים שני שלמים ושביעית.']],
[['4 3/12 − 3 × 5/12','3','בצעו קודם את הכפל.','המכפלה היא 15 חלקי 12, שהם שלם ושלוש שתים־עשריות. מחסרים ומקבלים 3.'],['36 ÷ (4 7/13 + 1 6/13)','6','חברו את השברים שבסוגריים.','שבע ועוד שש הן שלוש־עשרה שלוש־עשריות, כלומר שלם. בסוגריים מתקבל 6, ולכן מחלקים 36 ב־6.'],['14 3/7 − (6 6/7 + 1 4/7)','6','הרכיבו שלם נוסף בתוך הסוגריים.','בסוגריים מתקבל שמונה ושלוש שביעיות. בחיסור מתקבלים שישה שלמים.']],
[['במופע מחול השתתפו 100 ילדות. בשני טורים עמדו 12 ילדות בכל טור. כמה ילדות רקדו במעגלים אם כל השאר רקדו במעגלים?','76','חשבו כמה עמדו בשני הטורים יחד.','בשני הטורים עמדו 24 ילדות. מחסרים 24 מ־100.'],['מתוך 50 ילדות, 20 בחוג פיסול והשאר בציור. ילדות הציור עמדו ב־5 שורות שוות. כמה היו בכל שורה?','6','מצאו את מספר ילדות הציור.','30 ילדות בחוג ציור. מחלקים 30 ב־5.'],['11 ילדות ניגנו בכלי הקשה. מספר המנגנות בכלי נשיפה היה פי 3. כמה נגניות היו בסך הכול?','44','מוסיפים גם את נגניות כלי ההקשה.','33 ניגנו בכלי נשיפה. יחד עם 11 נגניות כלי ההקשה מתקבלות 44.'],['על הבמה היו 110 ילדות. 40 עמדו בקשת והיתר בשורות של 10. כמה שורות נוצרו?','7','התחילו במספר הילדות שנותרו.','70 ילדות עמדו בשורות, ועשר בכל שורה.'],['הביאו 5 מארזי מים ובהם 24 בקבוקים בכל מארז, ועוד 10 ארגזי שתייה ובהם 20 בקבוקים בכל ארגז. כמה בקבוקים הביאו?','320','חשבו כל סוג בנפרד.','120 בקבוקי מים ועוד 200 בקבוקי שתייה הם 320 בקבוקים.'],['הביאו 7 מגשי כריכים. מספר מגשי המאפים כפול ממספר מגשי הכריכים. מספר מגשי הירקות קטן ב־3 ממספר מגשי הכריכים. כמה מגשים הביאו?','25','מצאו כמה מגשים יש מכל סוג.','7 מגשי כריכים, 14 מגשי מאפים ו־4 מגשי ירקות הם 25 מגשים.']]
];
const app=document.querySelector('main');let queue=[],index=0,results=[],mode='home',active=0;
function math(s){return s.replace(/(\d+)\/(\d+)/g,'<span class="frac"><i>$1</i><i>$2</i></span>')}
function display(t,q){if(t===0){let [a,o,b]=q.split(' ');return '<div class="eq"><div class="vertical">'+a+'<span>'+o+' '+b+'</span></div></div>'}return /[א-ת]/.test(q)?'<h2>'+q+'</h2>':'<div class="eq">'+math(q)+'</div>'}
function home(){mode='home';app.innerHTML='<section class="hero"><small>חשבון לכיתה ה׳</small><h1>מתכוננים למבחן</h1><p>בוחרים נושא ללימוד ולתרגול, או מתחילים מבחן שמחבר בין כל הנושאים.</p><button onclick="exam()">התחלת מבחן · 16 שאלות</button></section><h2>מה נלמד היום?</h2><div class="grid">'+topics.map(([n,i],t)=>'<button class="tile" onclick="lesson('+t+')"><span class="icon">'+i+'</span>'+n+'</button>').join('')+'</div>'}
function goHome(){if(mode!=='exam'||confirm('לצאת מהמבחן? התשובות בסבב הזה יימחקו.'))home()}
function bars(){return '<div dir="ltr">'+[7,7,7,7,3].map(k=>'<span class="bar">'+Array.from({length:7},(_,i)=>'<i class="'+(i<k?'on':'')+'"></i>').join('')+'</span>').join('')+'</div>'}
function lesson(t){mode='lesson';active=t;let [q,a,h,e]=bank[t][0];app.innerHTML='<small>לימוד ותרגול</small><h1>'+topics[t][0]+'</h1><section><p>'+topics[t][2]+'</p>'+(t===5?bars()+'<small>ארבעה שלמים ושלוש שביעיות</small>':'')+'<h2>דוגמה פתורה</h2>'+display(t,q)+'<p>'+e+'</p><strong>תשובה <bdi>'+math(a)+'</bdi></strong></section><button onclick="practice()">לתרגול בנושא הזה</button>'}
function mix(a){let v=[...a];for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v}
function practice(){start('practice',mix(bank[active]).map(q=>[active,q]))}
function exam(){start('exam',mix(bank.flatMap((qs,t)=>mix(qs).slice(0,2).map(q=>[t,q]))))}
function start(m,list){mode=m;queue=list;index=0;results=[];question()}
function question(){let [t,[q,a,h]]=queue[index];let yes=['כן','לא'].includes(a);app.innerHTML='<small>'+(mode==='exam'?'מבחן מסכם':'תרגול')+' · שאלה '+(index+1)+' מתוך '+queue.length+'</small><progress max="'+queue.length+'" value="'+index+'"></progress><h1>'+topics[t][0]+'</h1><section>'+display(t,q)+'<form id="form">'+(yes?'<select id="ans" required style="font:inherit;padding:8px"><option value="">בחרו תשובה</option><option>כן</option><option>לא</option></select>':'<label for="ans">התשובה שלי</label><br><input id="ans" maxlength="50" autocomplete="off" required>'+(t===5||t===6?'<p><small>אפשר להקליד שבר כמו <bdi>3/7</bdi> או מספר מעורב כמו <bdi>2 1/7</bdi>.</small></p>':''))+'<p><button>'+(mode==='exam'?'שמירת תשובה והמשך':'בדיקת תשובה')+'</button></p></form>'+(mode==='practice'?'<details><summary>רמז</summary><p>'+h+'</p></details>':'')+'<div id="feedback" role="status"></div></section>';document.querySelector('form').onsubmit=submit}
function val(s){s=s.trim().replace(/,/g,'');if(['כן','לא'].includes(s))return s;if(/^\d+$/.test(s))return Number(s);let m=s.match(/^(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)$/);if(m&&+m[3])return Number(m[1]||0)+m[2]/m[3];return null}
function submit(e){e.preventDefault();let v=document.querySelector('#ans').value.trim(),[t,[q,a,h,why]]=queue[index],fb=document.querySelector('#feedback');if(val(v)===null){fb.textContent='הקלידו מספר שלם, שבר או מספר מעורב.';return}let ok=val(v)===val(a);results.push({v,ok});if(mode==='exam'){next();return}document.querySelector('form button').disabled=true;document.querySelector('#ans').disabled=true;fb.innerHTML='<div class="note"><strong>'+(ok?'נכון!':'נבדוק יחד')+'</strong><p>'+why+'</p>תשובה <bdi>'+math(a)+'</bdi></div><button onclick="next()">'+(index+1===queue.length?'לסיכום':'לתרגיל הבא')+'</button>'}
function next(){if(++index<queue.length){question();return}let errors=queue.filter((_,i)=>!results[i].ok);mode='done';app.innerHTML='<section class="hero"><small>סיכום הסבב</small><h1>'+ (queue.length-errors.length)+' מתוך '+queue.length+' תשובות נכונות</h1></section>'+(errors.length?'<button id="retry">תרגול השאלות שטעיתי בהן</button>':'')+'<button class="light" onclick="home()">חזרה לנושאים</button><h2>התשובות שלי</h2>'+queue.map(([t,[q,a,h,why]],i)=>'<article><strong>'+(results[i].ok?'✓ נכון':'✎ כדאי לחזור')+' · '+topics[t][0]+'</strong>'+display(t,q)+'<p>ענית <bdi>'+results[i].v.replace(/[^0-9 /,כןלא]/g,'')+'</bdi> · תשובה נכונה <bdi>'+math(a)+'</bdi></p>'+why+'</article>').join('');if(errors.length)document.querySelector('#retry').onclick=()=>start('practice',errors);window.scrollTo(0,0)}
home();
</script></html>
