    .progress-track {

      height: 7px;
      background: #e6efe9;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--forest);
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;

      align-items: center;

      gap: 12px;

      color: #ffffff;

      align-items: center;
      justify-content: center;

      background: #f4faf6;

    .option-btn.correct {

      border-color: var(--success-border);
      color: var(--success-text);
    }

    .option-btn.wrong {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .spelling-form {
      display: flex;
      align-items: stretch;
      gap: 10px;
      width: 100%;

      color: var(--text-main);

    .spelling-input:focus {

      border-color: var(--forest);

    .spelling-input:disabled {

      gap: 12px;

      border: 1px solid #edc3bc;
      color: var(--error-text);

      font-weight: 700;

      flex-wrap: wrap;
      align-items: center;
      gap: 6px;

      unicode-bidi: isolate;
      font-weight: 800;

    .feedback-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;

      font-weight: 800;
      color: var(--forest-dark);

      font-weight: 700;
      color: var(--text-main);

    .summary-sub {

      color: var(--text-muted);

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--forest-dark);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      body {

      .hero-banner {

        padding: 18px;
        gap: 14px;
      }

      .hero-art {
        width: 100%;
        height: 82px;

      .control-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .mode-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .mode-btn {
        padding: 9px 6px;
        font-size: 0.88rem;
      }

      .topic-picker {
        justify-content: space-between;
      }

      .topic-select {
        flex: 1;
      }

      .practice-card {
        padding: 16px;
      }

      .options-grid {
        grid-template-columns: 1fr;
      }

      .spelling-form {
        flex-direction: column;
      }
    }
  </style>
</head>

        // 1 Practice Sentence
        {
          id: "how-much-does-it-cost",
          en: "How much does it cost?",
          speak: "How much does it cost?",
          accepted: ["how much does it cost?", "how much does it cost"],
          he: "כמה זה עולה?",
          topic: "sentence",
          topicLabel: "משפט",
          emoji: "🏷️"
        }
      ];

      const TOPICS = [
        { id: "all", label: "כל המילים" },
        { id: "main", label: "מילים עיקריות" },
        { id: "bonus", label: "מילות בונוס" },
        { id: "sentence", label: "משפט לתרגול" }
      ];

      const state = {
        mode: "flashcards",
        topic: "all",
        // Flashcards state
        cardIndex: 0,
        revealed: false,
        // Quiz state (choice, listening, spelling)
        quizItems: [],
        quizIndex: 0,
        score: 0,
        answered: false,
        lastCorrect: false,
        selectedOptionId: null,
        currentOptions: [],
        userTyped: "",
        finished: false
      };

      const practiceCard = document.getElementById("practiceCard");
      const topicSelect = document.getElementById("topicSelect");
      const modeButtons = Array.from(document.querySelectorAll(".mode-btn"));
      const toastEl = document.getElementById("toast");
      let toastTimer = null;

      function getFilteredWords(topicId) {
        if (topicId === "all") return WORDS.slice();
        return WORDS.filter((w) => w.topic === topicId);
      }

      function shuffle(list) {
        const arr = list.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function normalizeAnswer(str) {
        return str
          .trim()
          .toLowerCase()
          .replace(/[’']/g, "'")
          .replace(/\s+/g, " ");
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove("visible");
        }, 2200);
      }

      function speakText(text, btnEl) {
        if (!("speechSynthesis" in window)) {
          showToast("השמעת קול אינה נתמכת בדפדפן זה");
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = "en-US";
          utter.rate = 0.9;
          const voices = window.speechSynthesis.getVoices();
          const enVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("en-us"))
            || voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
          if (enVoice) utter.voice = enVoice;

          if (btnEl) {
            btnEl.classList.add("speaking");
            utter.onend = () => btnEl.classList.remove("speaking");
            utter.onerror = () => btnEl.classList.remove("speaking");
          }
          window.speechSynthesis.speak(utter);
        } catch (err) {
          showToast("לא ניתן להשמיע כרגע");
        }
      }

      function populateTopics() {
        topicSelect.innerHTML = "";
        TOPICS.forEach((t) => {
          const count = getFilteredWords(t.id).length;
          const opt = document.createElement("option");
          opt.value = t.id;
          opt.textContent = `${t.label} (${count})`;
          topicSelect.appendChild(opt);
        });
        topicSelect.value = state.topic;
      }

      function buildOptionsFor(correctItem) {
        const topicPool = getFilteredWords(state.topic).filter((w) => w.id !== correctItem.id);
        const fallbackPool = WORDS.filter(
          (w) => w.id !== correctItem.id && !topicPool.some((t) => t.id === w.id)
        );
        const distractors = shuffle(topicPool).concat(shuffle(fallbackPool)).slice(0, 3);
        return shuffle([correctItem, ...distractors]);
      }

      function startMode(newMode) {
        state.mode = newMode;
        modeButtons.forEach((btn) => {
          const isActive = btn.dataset.mode === newMode;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-selected", isActive ? "true" : "false");
        });
        resetCurrentSession();
      }

      function resetCurrentSession() {
        const pool = getFilteredWords(state.topic);
        if (state.mode === "flashcards") {
          state.cardIndex = 0;
          state.revealed = false;
        } else {
          const roundLength = Math.min(10, pool.length);
          state.quizItems = shuffle(pool).slice(0, roundLength);
          state.quizIndex = 0;
          state.score = 0;
          state.answered = false;
          state.lastCorrect = false;
          state.selectedOptionId = null;
          state.userTyped = "";
          state.finished = false;
          if (state.quizItems.length > 0 && (state.mode === "choice" || state.mode === "listening")) {
            state.currentOptions = buildOptionsFor(state.quizItems[0]);
          } else {
            state.currentOptions = [];          }
        }
        render();
      }

      function renderFlashcards() {
        const pool = getFilteredWords(state.topic);
        const total = pool.length;
        const item = pool[state.cardIndex];
        const pct = total > 0 ? ((state.cardIndex + 1) / total) * 100 : 0;

        practiceCard.innerHTML = "";

        const header = document.createElement("div");
        header.className = "card-header";
        header.innerHTML = `
          <div class="status-row">
            <span>כרטיס ${state.cardIndex + 1} מתוך ${total}</span>
            <span>${item.topicLabel}</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${pct}%"></div>
          </div>
        `;
        practiceCard.appendChild(header);

        const stage = document.createElement("div");
        stage.className = "mint-stage";

        const badgeRow = document.createElement("div");
        badgeRow.className = "badge-row";
        if (item.topic === "bonus" || item.topic === "sentence") {
          const pill = document.createElement("span");
          pill.className = "tag-pill" + (item.topic === "bonus" ? " bonus" : "");
          pill.textContent = item.topic === "bonus" ? "⭐ בונוס" : "💬 משפט לתרגול";
          badgeRow.appendChild(pill);
        }
        stage.appendChild(badgeRow);

        const emojiEl = document.createElement("div");
        emojiEl.className = "word-emoji";
        emojiEl.textContent = item.emoji;
        stage.appendChild(emojiEl);

        const enEl = document.createElement("div");
        enEl.className = "word-en";
        enEl.textContent = item.en;
        stage.appendChild(enEl);

        if (state.revealed) {
          const heEl = document.createElement("div");
          heEl.className = "revealed-translation";
          heEl.textContent = item.he;
          stage.appendChild(heEl);
        } else {
          const hintEl = document.createElement("p");
          hintEl.className = "helper-hint";
          hintEl.textContent = "נסי להיזכר בתרגום לפני שאת מגלה אותו.";
          stage.appendChild(hintEl);
        }

        const audioBtn = document.createElement("button");
        audioBtn.type = "button";
        audioBtn.className = "btn btn-audio";
        audioBtn.textContent = "🔊 השמעה";
        audioBtn.addEventListener("click", () => speakText(item.speak, audioBtn));
        stage.appendChild(audioBtn);

        practiceCard.appendChild(stage);

        const nav = document.createElement("div");
        nav.className = "nav-actions";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "btn btn-secondary";
        prevBtn.textContent = "הקודם";
        prevBtn.disabled = total <= 1;
        prevBtn.addEventListener("click", () => {
          state.cardIndex = (state.cardIndex - 1 + total) % total;
          state.revealed = false;
          render();
        });

        const revealBtn = document.createElement("button");
        revealBtn.type = "button";
        revealBtn.className = "btn btn-secondary";
        revealBtn.textContent = state.revealed ? "הסתרת תרגום" : "גילוי תרגום";
        revealBtn.addEventListener("click", () => {
          state.revealed = !state.revealed;
          render();
        });

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn btn-primary";
        nextBtn.textContent = "הבא";
        nextBtn.disabled = total <= 1;
        nextBtn.addEventListener("click", () => {
          state.cardIndex = (state.cardIndex + 1) % total;
          state.revealed = false;
          render();
        });

        nav.appendChild(prevBtn);
        nav.appendChild(revealBtn);
        nav.appendChild(nextBtn);
        practiceCard.appendChild(nav);
      }

      function renderQuizHeader(total) {
        const currentNum = Math.min(state.quizIndex + 1, total);
        const pct = total > 0 ? (currentNum / total) * 100 : 0;
        const header = document.createElement("div");
        header.className = "card-header";
        header.innerHTML = `
          <div class="status-row">
            <span>שאלה ${currentNum} מתוך ${total}</span>
            <span class="score-pill">⭐ ${state.score} נכונות</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${pct}%"></div>
          </div>
        `;
        return header;
      }

      function renderFeedback(item) {
        const fb = document.createElement("div");
        fb.className = "feedback-area " + (state.lastCorrect ? "correct" : "wrong");

        const msg = document.createElement("div");
        msg.className = "feedback-msg";
        if (state.lastCorrect) {
          msg.innerHTML = `<span>✓ מעולה!</span> <span class="feedback-en">${item.en}</span> <span>· ${item.he}</span>`;
        } else {
          msg.innerHTML = `<span>הפעם התשובה היא</span> <span class="feedback-en">${item.en}</span> <span>· ${item.he}</span>`;
        }
        fb.appendChild(msg);

        const actions = document.createElement("div");
        actions.className = "feedback-actions";

        const listenBtn = document.createElement("button");
        listenBtn.type = "button";
        listenBtn.className = "btn btn-audio";
        listenBtn.textContent = "🔊 שמיעת התשובה";
        listenBtn.addEventListener("click", () => speakText(item.speak, listenBtn));

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn btn-primary";
        const isLast = state.quizIndex + 1 >= state.quizItems.length;
        nextBtn.textContent = isLast ? "לסיכום" : "המשך";
        nextBtn.addEventListener("click", advanceQuiz);

        actions.appendChild(listenBtn);
        actions.appendChild(nextBtn);
        fb.appendChild(actions);

        return fb;
      }

      function advanceQuiz() {
        if (state.quizIndex + 1 >= state.quizItems.length) {
          state.finished = true;
          render();
          return;
        }
        state.quizIndex += 1;
        state.answered = false;
        state.lastCorrect = false;
        state.selectedOptionId = null;
        state.userTyped = "";
        if (state.mode === "choice" || state.mode === "listening") {
          state.currentOptions = buildOptionsFor(state.quizItems[state.quizIndex]);
        }
        render();
        if (state.mode === "listening") {
          speakText(state.quizItems[state.quizIndex].speak);
        }
      }

      function renderSummary() {
        const total = state.quizItems.length;
        const ratio = total > 0 ? state.score / total : 0;
        let title = "כל הכבוד!";
        let stars = "🌟";
        let sub = "תרגול נהדר — אפשר לנסות שוב או לעבור למצב תרגול אחר.";

        if (ratio === 1) {
          title = "מושלם! ענית על הכול נכון!";
          stars = "🏆";
          sub = "שליטה מצוינת בכל המילים שבתרגול.";
        } else if (ratio >= 0.7) {
          title = "עבודה מעולה!";
          stars = "⭐";
          sub = "כמעט הכול נכון — עוד סבב קצר וזה יושב מצוין.";
        } else {
          title = "התחלה טובה!";
          stars = "💪";
          sub = "כדאי לחזור רגע לכרטיסיות ואז לנסות שוב.";
        }

        practiceCard.innerHTML = "";
        const box = document.createElement("div");
        box.className = "summary-stage";
        box.innerHTML = `
          <div class="summary-stars">${stars}</div>
          <h2 class="summary-title">${title}</h2>
          <p class="summary-score">⭐ ${state.score} נכונות מתוך ${total}</p>
          <p class="summary-sub">${sub}</p>
        `;

        const restartBtn = document.createElement("button");
        restartBtn.type = "button";
        restartBtn.className = "btn btn-primary";
        restartBtn.textContent = "תרגול חדש";
        restartBtn.addEventListener("click", resetCurrentSession);
        box.appendChild(restartBtn);

        practiceCard.appendChild(box);
      }

      function renderChoice() {
        if (state.finished) {
          renderSummary();
          return;
        }
        const total = state.quizItems.length;
        const item = state.quizItems[state.quizIndex];

        practiceCard.innerHTML = "";
        practiceCard.appendChild(renderQuizHeader(total));

        const stage = document.createElement("div");
        stage.className = "mint-stage";

        const emojiEl = document.createElement("div");
        emojiEl.className = "word-emoji";
        emojiEl.textContent = item.emoji;
        stage.appendChild(emojiEl);

        const heEl = document.createElement("div");
        heEl.className = "word-he";
        heEl.textContent = item.he;
        stage.appendChild(heEl);

        const hintEl = document.createElement("p");
        hintEl.className = "helper-hint";
        hintEl.textContent = "בחרי את התרגום באנגלית.";
        stage.appendChild(hintEl);

        practiceCard.appendChild(stage);

        const grid = document.createElement("div");
        grid.className = "options-grid";

        state.currentOptions.forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn ltr-text";
          btn.textContent = opt.en;
          btn.disabled = state.answered;

          if (state.answered) {
            if (opt.id === item.id) {
              btn.classList.add("correct");
            } else if (opt.id === state.selectedOptionId) {
              btn.classList.add("wrong");
            }
          } else {
            btn.addEventListener("click", () => {
              state.answered = true;
              state.selectedOptionId = opt.id;
              state.lastCorrect = opt.id === item.id;
              if (state.lastCorrect) state.score += 1;
              render();
            });
          }

          grid.appendChild(btn);
        });

        practiceCard.appendChild(grid);

        if (state.answered) {
          practiceCard.appendChild(renderFeedback(item));
        }
      }

      function renderListening() {
        if (state.finished) {
          renderSummary();
          return;
        }
        const total = state.quizItems.length;
        const item = state.quizItems[state.quizIndex];

        practiceCard.innerHTML = "";
        practiceCard.appendChild(renderQuizHeader(total));

        const stage = document.createElement("div");
        stage.className = "mint-stage";

        const titleEl = document.createElement("div");
        titleEl.className = "word-he";
        titleEl.textContent = "מה שמעת?";
        stage.appendChild(titleEl);

        const hintEl = document.createElement("p");
        hintEl.className = "helper-hint";
        hintEl.textContent = "לחצי על הכפתור ובחרי את הפירוש בעברית.";
        stage.appendChild(hintEl);

        const audioBtn = document.createElement("button");
        audioBtn.type = "button";
        audioBtn.className = "btn btn-audio";
        audioBtn.textContent = "🔊 השמעה";
        audioBtn.addEventListener("click", () => speakText(item.speak, audioBtn));
        stage.appendChild(audioBtn);

        practiceCard.appendChild(stage);

        const grid = document.createElement("div");
        grid.className = "options-grid";

        state.currentOptions.forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.textContent = opt.he;
          btn.disabled = state.answered;

          if (state.answered) {
            if (opt.id === item.id) {
              btn.classList.add("correct");
            } else if (opt.id === state.selectedOptionId) {
              btn.classList.add("wrong");
            }
          } else {
            btn.addEventListener("click", () => {
              state.answered = true;
              state.selectedOptionId = opt.id;
              state.lastCorrect = opt.id === item.id;
              if (state.lastCorrect) state.score += 1;
              render();
            });
          }

          grid.appendChild(btn);
        });

        practiceCard.appendChild(grid);

        if (state.answered) {
          practiceCard.appendChild(renderFeedback(item));
        }
      }

      function renderSpelling() {
        if (state.finished) {
          renderSummary();
          return;
        }
        const total = state.quizItems.length;
        const item = state.quizItems[state.quizIndex];

        practiceCard.innerHTML = "";
        practiceCard.appendChild(renderQuizHeader(total));

        const stage = document.createElement("div");
        stage.className = "mint-stage";

        const emojiEl = document.createElement("div");
        emojiEl.className = "word-emoji";
        emojiEl.textContent = item.emoji;
        stage.appendChild(emojiEl);

        const heEl = document.createElement("div");
        heEl.className = "word-he";
        heEl.textContent = item.he;
        stage.appendChild(heEl);

        const hintEl = document.createElement("p");
        hintEl.className = "helper-hint";
        hintEl.textContent = "כתבי באנגלית.";
        stage.appendChild(hintEl);

        practiceCard.appendChild(stage);

        const form = document.createElement("form");
        form.className = "spelling-form";
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          if (state.answered) {
            advanceQuiz();
            return;
          }
          const raw = inputEl.value;
          if (!raw.trim()) {
            showToast("כתבי תשובה באנגלית לפני הבדיקה");
            inputEl.focus();
            return;
          }
          state.userTyped = raw;
          const normalized = normalizeAnswer(raw);
          const isMatch = item.accepted.some((acc) => normalizeAnswer(acc) === normalized);
          state.answered = true;
          state.lastCorrect = isMatch;
          if (isMatch) state.score += 1;
          render();
        });

        const inputEl = document.createElement("input");
        inputEl.type = "text";
        inputEl.className = "spelling-input";
        inputEl.placeholder = "Type in English";
        inputEl.autocomplete = "off";
        inputEl.autocapitalize = "off";
        inputEl.spellcheck = false;
        inputEl.value = state.userTyped;
        inputEl.disabled = state.answered;

        const checkBtn = document.createElement("button");
        checkBtn.type = "submit";
        checkBtn.className = "btn btn-primary";
        checkBtn.textContent = "בדיקה";
        checkBtn.disabled = state.answered;

        form.appendChild(inputEl);
        form.appendChild(checkBtn);
        practiceCard.appendChild(form);

        if (state.answered) {
          practiceCard.appendChild(renderFeedback(item));
        } else {
          setTimeout(() => inputEl.focus(), 0);
        }
      }

      function render() {
        if (state.mode === "flashcards") {
          renderFlashcards();
        } else if (state.mode === "choice") {
          renderChoice();
        } else if (state.mode === "listening") {
          renderListening();
        } else if (state.mode === "spelling") {
          renderSpelling();
        }
      }

      // Wire top controls
      modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => startMode(btn.dataset.mode));
      });

      topicSelect.addEventListener("change", () => {
        state.topic = topicSelect.value;
        resetCurrentSession();
      });

      // Keyboard navigation for flashcards and spelling Enter-to-continue
      document.addEventListener("keydown", (e) => {
        if (state.mode === "flashcards") {
          const pool = getFilteredWords(state.topic);
          if (pool.length === 0) return;
          if (e.key === " " || e.key === "Enter") {
            if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
            e.preventDefault();
            state.revealed = !state.revealed;
            render();
          } else if (e.key === "ArrowLeft" && pool.length > 1) {
            state.cardIndex = (state.cardIndex + 1) % pool.length;
            state.revealed = false;
            render();
          } else if (e.key === "ArrowRight" && pool.length > 1) {
            state.cardIndex = (state.cardIndex - 1 + pool.length) % pool.length;
            state.revealed = false;
            render();
          }
        } else if (state.mode === "spelling" && state.answered && e.key === "Enter") {
          e.preventDefault();
          advanceQuiz();
        }
      });

      // Preload voices if supported
      if ("speechSynthesis" in window && typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      populateTopics();
      render();
    })();
  </script>
</body>
</html>
